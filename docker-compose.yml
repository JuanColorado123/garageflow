name: garageflow

services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-taller}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-taller}
    ports:
      - "15672:15672"
    healthcheck:
      # Como usuario rabbitmq, para que la cookie de Erlang no quede de root
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  mysql-ordenes:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ordenes_db
      MYSQL_USER: ordenes
      MYSQL_PASSWORD: ${ORDENES_DB_PASSWORD:-ordenes}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - datos-ordenes:/var/lib/mysql
      - ./garageflow-services/ms-ordenes/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-agenda:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: agenda_db
      MYSQL_USER: agenda
      MYSQL_PASSWORD: ${AGENDA_DB_PASSWORD:-agenda}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - datos-agenda:/var/lib/mysql
      - ./garageflow-services/ms-agenda/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-auditoria:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: auditoria_db
      AUDITORIA_APP_PASSWORD: ${AUDITORIA_APP_PASSWORD:-auditoria}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - datos-auditoria:/var/lib/mysql
      - ./garageflow-services/ms-auditoria/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-notificaciones:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: notificaciones_db
      MYSQL_USER: notificaciones
      MYSQL_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - datos-notificaciones:/var/lib/mysql
      - ./garageflow-services/ms-notificaciones/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  ms-ordenes:
    build: ./garageflow-services/ms-ordenes
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-ordenes:3306/ordenes_db?sslMode=DISABLED&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ordenes
      SPRING_DATASOURCE_PASSWORD: ${ORDENES_DB_PASSWORD:-ordenes}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-taller}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-taller}
      APP_CORS_ORIGEN: http://localhost:4200
      TZ: ${TZ:-America/Bogota}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      mysql-ordenes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  ms-agenda:
    build: ./garageflow-services/ms-agenda
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-agenda:3306/agenda_db?sslMode=DISABLED&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: agenda
      SPRING_DATASOURCE_PASSWORD: ${AGENDA_DB_PASSWORD:-agenda}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-taller}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-taller}
      APP_CORS_ORIGEN: http://localhost:4200
      APP_ORDENES_URL: http://ms-ordenes:8081
      TZ: ${TZ:-America/Bogota}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      mysql-agenda:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  ms-auditoria:
    build: ./garageflow-services/ms-auditoria
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-auditoria:3306/auditoria_db?sslMode=DISABLED&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: auditoria_app
      SPRING_DATASOURCE_PASSWORD: ${AUDITORIA_APP_PASSWORD:-auditoria}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-taller}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-taller}
      APP_CORS_ORIGEN: http://localhost:4200
      TZ: ${TZ:-America/Bogota}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      mysql-auditoria:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  ms-notificaciones:
    build: ./garageflow-services/ms-notificaciones
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-notificaciones:3306/notificaciones_db?sslMode=DISABLED&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: notificaciones
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-taller}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-taller}
      TZ: ${TZ:-America/Bogota}
      JAVA_TOOL_OPTIONS: -Xmx256m
    depends_on:
      mysql-notificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  garageflow-web:
    build: ./garageflow-web
    ports:
      - "4200:4200"
    depends_on:
      - ms-ordenes
      - ms-agenda
      - ms-auditoria

  datos-ejemplo:
    image: node:22-slim
    command: ["node", "/seed/seed.mjs"]
    volumes:
      - ./seed:/seed:ro
    environment:
      ORDENES_URL: http://ms-ordenes:8081
      AGENDA_URL: http://ms-agenda:8082
      AUDITORIA_URL: http://ms-auditoria:8083
      FORZAR: ${FORZAR:-0}
      TZ: ${TZ:-America/Bogota}
    depends_on:
      - ms-ordenes
      - ms-agenda
      - ms-auditoria
      - ms-notificaciones
    restart: "no"

volumes:
  datos-ordenes:
  datos-agenda:
  datos-auditoria:
  datos-notificaciones:
