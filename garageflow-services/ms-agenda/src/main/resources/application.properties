spring.application.name=ms-agenda
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/agenda_db?sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.username=agenda
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
app.cors.origen=http://localhost:4200
app.ordenes.url=http://localhost:8081
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
