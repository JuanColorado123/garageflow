spring.application.name=ms-notificaciones
server.port=8084
spring.datasource.url=jdbc:mysql://localhost:3306/notificaciones_db?sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.username=notificaciones
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
