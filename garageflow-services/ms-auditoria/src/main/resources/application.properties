spring.application.name=ms-auditoria
server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/auditoria_db?sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.username=auditoria_app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
app.cors.origen=http://localhost:4200
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
